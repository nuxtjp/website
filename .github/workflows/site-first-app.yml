name: Verify standalone introduction app
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: module-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.29.3
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/site-first-store" --registry=https://registry.npmjs.org
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm generate
        env:
          NUXT_TELEMETRY_DISABLED: '1'
          CI: 'true'
      - name: Verify the public catalog export matches the source
        run: |
          cmp ../content/nuxtjp/public/oss/showcase.json .output/public/oss/showcase.json
          test -f .output/public/modules/index.html
          test -f .output/public/en/modules/index.html
