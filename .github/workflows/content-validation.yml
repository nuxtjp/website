name: Validate site content
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.29.3
      - name: Install the owner-locked validation toolchain without lifecycle scripts
        run: pnpm --dir module-site install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/content-store" --registry=https://registry.npmjs.org
      - name: Validate the migrated public site configuration
        run: pnpm --dir module-site exec nuxtjp-localized-site validate --content-root ../content/nuxtjp
